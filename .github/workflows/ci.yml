name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Build generator module
        if: runner.os == 'Linux'
        run: cd internal/sjisgen && go build ./... && go vet ./...
      - name: Test (race)
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Fuzz encode
        run: go test -run '^$' -fuzz FuzzEncode -fuzztime 30s .
      - name: Fuzz penalty
        run: go test -run '^$' -fuzz FuzzPenalty -fuzztime 15s .
      - name: Fuzz explicit segments
        run: go test -run '^$' -fuzz FuzzExplicitSegments -fuzztime 10s .
      - name: Fuzz ECI
        run: go test -run '^$' -fuzz FuzzECI -fuzztime 10s .
      - name: Fuzz Kanji
        run: go test -run '^$' -fuzz FuzzKanjiString -fuzztime 10s .
      - name: Fuzz structured append
        run: go test -run '^$' -fuzz FuzzStructured -fuzztime 10s .
      - name: Fuzz mask
        run: go test -run '^$' -fuzz FuzzMask -fuzztime 10s .
